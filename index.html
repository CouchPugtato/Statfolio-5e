<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171e29" />
    <meta
      name="description"
      content="Your personal 5e character folio. Character sheets, campaign notes, and portable backups, saved in your browser."
    />
    <title>Statfolio</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/fonts/Manrope-variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./text-format.js"></script>
    <script defer src="./pdf-sheet.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <input
      id="restore-file"
      type="file"
      accept=".json,.statfolio,application/json"
      hidden
    />
  </body>
</html>
